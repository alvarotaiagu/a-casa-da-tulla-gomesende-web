<!-- script bloqueante: clases antes del primer pintado y el puente con la cortina (js/grano.js) -->
<script>
(function (d) {
  var h = d.documentElement;
  h.classList.add('js');
  // MANDO DE MAQUETA (no viaja al cliente): solo con ?revision
  try {
    var q = new URLSearchParams(location.search);
    if (q.has('revision')) {
      h.classList.add('revision');
      if (q.get('densidad') === 'sobria') h.classList.add('densidad-sobria');
    }
  } catch (e) {}
  // el puente con la cortina: existe desde el primer momento, cargue antes quien cargue.
  // La cortina llama a Tulla.abrir() cuando EMPIEZA a abrirse y a Tulla.retirarCortina() al acabar
  // (o lanza los eventos tulla:cortina-abre / tulla:cortina-fuera); la web y los módulos usan Tulla.alAbrirse(fn).
  var T = window.Tulla = window.Tulla || {};
  var cola = [];
  var avisar = function (n) { try { d.dispatchEvent(new CustomEvent(n)); } catch (e) {} };
  T.alAbrirse = function (fn) { if (T.abierta) { try { fn(); } catch (e) { console.warn(e); } } else cola.push(fn); };
  T.abrir = function () {
    if (T.abierta) return;
    T.abierta = true;
    cola.splice(0).forEach(function (fn) { try { fn(); } catch (e) { console.warn(e); } });
    avisar('tulla:abierta');
  };
  T.retirarCortina = function () {
    if (T.cortinaFuera) return;
    T.cortinaFuera = true;
    clearTimeout(window.__redCortina);
    h.classList.remove('cortina-activa');
    h.classList.add('cortina-fuera');
    T.abrir();
    avisar('tulla:fuera');
  };
  d.addEventListener('tulla:cortina-abre', function () { T.abrir(); });
  d.addEventListener('tulla:cortina-fuera', function () { T.retirarCortina(); });
  // red de seguridad por si main.js o grano.js no llegan: la cortina se va sola
  window.__redCortina = setTimeout(function () { T.retirarCortina(); }, 6500);
})(document);
</script>
